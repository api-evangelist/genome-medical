aid: genome-medical
name: Genome Medical
description: Genome Medical is a telehealth-enabled genetic services provider offering expert genetic
  counseling, test selection and ordering support, results interpretation, and clinical trial matching
  for individuals with rare and hereditary conditions. It partners with health systems, life sciences
  organizations, and genetic testing labs to scale genetic care, reduce diagnostic backlogs, and
  accelerate diagnoses through a proprietary clinical platform and patient portal. Genome Medical does
  not currently publish a public developer API; this profile captures its identity, security posture,
  and public web properties for the API Evangelist network.
